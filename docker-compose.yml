# TPX Grow - run everything with:  docker compose up --build
# Then open http://localhost:3000  (demo login: demo@example.com / password123)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tpxgrow
      POSTGRES_USER: tpxgrow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tpxgrow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpxgrow -d tpxgrow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tpxgrow
      DB_USER: tpxgrow
      DB_PASSWORD: ${DB_PASSWORD:-tpxgrow}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-long-random-string-0123456789}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
