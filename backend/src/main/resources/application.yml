server:
  port: ${PORT:8080}

spring:
  application:
    name: training-tool-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:tpxgrow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Override JWT_SECRET in any shared environment. Must be at least 32 characters.
    secret: ${JWT_SECRET:change-me-please-this-is-a-local-dev-secret-only-0123456789}
    expiry-hours: ${JWT_EXPIRY_HOURS:72}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed-demo-data: ${SEED_DEMO_DATA:true}
  allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:}
  ai:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1500}
    timeout-seconds: ${ANTHROPIC_TIMEOUT_SECONDS:45}
